<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>مدیریت انرژی ساختمان - مبحث ۱۹ و ۲۲</title>

  <!-- PWA / iOS Add-to-Home-Screen support -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2f6fed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="انرژی ساختمان">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="css/style.css">

<body>
  <div id="app">
    <header class="topbar">
      <img src="icons/logo.png" alt="لوگو">
      <div>

        <div class="subtitle">مبحث ۱۹ و ۲۲ &middot; Mehdi.R</div>
      </div>

    <main>
      <div class="page" id="page-project"></div>
      <div class="page" id="page-envelope"></div>
      <div class="page" id="page-equipment"></div>
      <div class="page" id="page-energy"></div>
      <div class="page" id="page-checklist"></div>
      <div class="page" id="page-ibms"></div>

    <nav class="tabbar">
      <button id="tabbtn-project"><span class="icon">🏠</span>پروژه</button>
      <button id="tabbtn-envelope"><span class="icon">🧱</span>پوسته</button>

      <button id="tabbtn-energy"><span class="icon">⚡</span>انرژی</button>
      <button id="tabbtn-checklist"><span class="icon">✅</span>بازرسی</button>
      <button id="tabbtn-ibms"><span class="icon">📡</span>IBMS</button>
      <button id="tabbtn-report"><span class="icon">📄</span>گزارش</button>
    </nav>
  </div>

  <div id="printArea"></div>

  <script src="js/data.js"></script>
  <script src="js/calculations.js"></script>
  <script src="js/app.js"></script>

</html>
